[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-scraper"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=12",
    "playwright>=1.40",
    "httpx>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["cloakbrowser"]
